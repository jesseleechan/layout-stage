<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Text rendering for the e2e browser (playwright.config.ts sets FONTCONFIG_FILE to this file).
     Machines differ in their font hinting (this container renders unhinted; Ubuntu's default is
     slight hinting), which moves glyph edges enough to fail the goldens. The sample sites' text is
     drawn with the bundled fonts in public/fonts, so turning hinting off everywhere makes it render
     the same on every Linux machine. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
