name: CI

on:
  push:
    branches: ['**'] # not tags
  pull_request:
  workflow_dispatch: # also started by the Update goldens workflow after it commits

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    # Pinned: the golden PNGs are compared on this image (see the Update goldens workflow).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Before the unit tests: the capture tests drive a real Chromium (and skip without one).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

      # CI=true: Playwright serves the build above with `next start` (playwright.config.ts). Offline:
      # pages may only reach the app, and the online capture test stays skipped (CAPTURE_ONLINE unset).
      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
